apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: infra-vcluster-runner-build
  namespace: infra
  labels:
    app.kubernetes.io/name: infra-vcluster-runner
spec:
  description: Build and publish the vCluster provider runner used by Infra.
  params:
    - name: git-url
      type: string
      description: Git repository containing provider/vcluster.
    - name: git-revision
      type: string
      default: codex/vcluster-provider-poc
    - name: image
      type: string
      description: Fully qualified destination image, including tag.
    - name: kubectl-version
      type: string
      default: v1.32.4
  workspaces:
    - name: source
    - name: registry-auth
  tasks:
    - name: clone
      taskSpec:
        params:
          - name: git-url
          - name: git-revision
        workspaces:
          - name: source
        steps:
          - name: clone
            image: alpine/git:2.47.2
            script: |
              #!/bin/sh
              set -eu
              rm -rf "$(workspaces.source.path)"/*
              git clone --depth 1 --branch "$(params.git-revision)" \
                "$(params.git-url)" "$(workspaces.source.path)"
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source

    - name: build-and-push
      runAfter: [clone]
      taskRef:
        name: infra-vcluster-runner-buildah
      params:
        - name: image
          value: $(params.image)
        - name: kubectl-version
          value: $(params.kubectl-version)
      workspaces:
        - name: source
          workspace: source
        - name: registry-auth
          workspace: registry-auth
