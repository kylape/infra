apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: infra-vcluster-runner-buildah
  namespace: infra
  labels:
    app.kubernetes.io/name: infra-vcluster-runner
  annotations:
    io.kubernetes.cri-o.userns-mode: auto:size=65536;map-to-root=true
    io.openshift.builder: "true"
spec:
  description: Build and publish an image with unprivileged Buildah on OpenShift.
  params:
    - name: image
      type: string
      description: Fully qualified destination image, including tag.
    - name: vcluster-version
      type: string
    - name: kubectl-version
      type: string
  workspaces:
    - name: source
    - name: registry-auth
  stepTemplate:
    image: quay.io/buildah/stable:v1.39.3
    workingDir: $(workspaces.source.path)
    env:
      - name: HOME
        value: /tekton/home
      - name: STORAGE_DRIVER
        value: vfs
      - name: BUILDAH_ISOLATION
        value: chroot
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        add:
          - SETFCAP
  steps:
    - name: build-and-push
      script: |
        #!/usr/bin/env bash
        set -Eeuo pipefail

        if [[ -f "$(workspaces.registry-auth.path)/.dockerconfigjson" ]]; then
          export REGISTRY_AUTH_FILE="$(workspaces.registry-auth.path)/.dockerconfigjson"
        fi

        buildah bud \
          --storage-driver=vfs \
          --isolation=chroot \
          --format=oci \
          --build-arg="VCLUSTER_VERSION=$(params.vcluster-version)" \
          --build-arg="KUBECTL_VERSION=$(params.kubectl-version)" \
          --tag "$(params.image)" \
          "$(workspaces.source.path)/provider/vcluster"
        buildah push \
          --storage-driver=vfs \
          "$(params.image)" \
          "docker://$(params.image)"
