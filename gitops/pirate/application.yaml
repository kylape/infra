apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-pirate
  namespace: argocd
  labels:
    app.kubernetes.io/name: infra
    app.kubernetes.io/part-of: llm-d-e2e-poc
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  sources:
    # Deploy the existing Infra Helm chart from this fork.
    - repoURL: https://github.com/kylape/infra.git
      targetRevision: codex/vcluster-provider-poc
      path: chart/infra-server
      helm:
        valueFiles:
          - $values/gitops/pirate/values.public.yaml

    # Keep the values in the same repository, but separate from the chart
    # source so this can later be replaced by a secret/plugin-backed source.
    - repoURL: https://github.com/kylape/infra.git
      targetRevision: codex/vcluster-provider-poc
      ref: values


    # Deploy the S3-compatible artifact store before Argo Workflows starts.
    - repoURL: https://github.com/kylape/infra.git
      targetRevision: codex/vcluster-provider-poc
      path: gitops/pirate
      directory:
        include: minio.yaml

    # Deploy the disposable development Keycloak instance.
    - repoURL: https://github.com/kylape/infra.git
      targetRevision: codex/vcluster-provider-poc
      path: gitops/pirate
      directory:
        include: keycloak.yaml

  # Keep this Application manual until the confidential configuration and
  # OpenShift-specific chart changes are supplied.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
