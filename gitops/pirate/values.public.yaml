# Public values for the Pirate development deployment.
#
# Confidential values are intentionally not stored in this repository. The
# current chart requires those values to render infra-server-secrets; see the
# accompanying README before syncing the Argo CD Application.

environment: development
monitoring:
  enabled: false
testMode: true
tag: minio-poc-20260918
image_repository: quay.io/klape/infra
vcluster:
  runnerImage: quay.io/klape/infra:minio-poc-20260918

# Bootstrap this Secret once in the management vCluster. It contains the
# OIDC configuration, including the persistent session signing key.
oidc_secret_name: infra-server-oidc
existing_config_secret_name: infra-server-secrets
minio_artifact_secret_name: minio-artifact-credentials
extra_host_aliases:
  - ip: 10.14.217.1
    hostnames:
      - keycloak-infra-vcluster-infra.apps.openshift.nm.rdu4.corp.redhat.com

# testMode disables the chart's GKE Ingress and ManagedCertificate resources.
# The OpenShift Route is supplied separately by this GitOps directory.
