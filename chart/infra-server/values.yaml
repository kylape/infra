# Default chart values. Override via --set or additional values files.
monitoring:
  enabled: true

image_repository: quay.io/rhacs-eng/infra-server

# Runner image used by the single proof-of-concept vCluster flavor.
vcluster:
  runnerImage: quay.io/klape/infra:latest

# S3-compatible artifact storage used by Argo Workflows and Infra.
minio_endpoint: ""
minio_access_key: ""
minio_secret_key: ""
minio_secure: false

# Name of a pre-created Secret containing an oidc.yaml key. When set, the
# chart mounts that key instead of requiring oidc_yaml in Helm values.
oidc_secret_name: ""

# Use pre-created configuration and artifact credential Secrets in GitOps.
existing_config_secret_name: ""
minio_artifact_secret_name: ""

# Optional host aliases for private cluster Routes that are not resolvable from
# the guest DNS domain.
extra_host_aliases: []
