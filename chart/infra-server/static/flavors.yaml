- id: vcluster
  name: vCluster
  description: Disposable vCluster hosted by the Infra management cluster.
  availability: default
  workflow: configuration/workflow-vcluster.yaml
  parameters:
    - name: name
      description: Name of the vCluster to create.
      value: vcluster
      kind: required

    - name: namespace
      description: Namespace in which to host the vCluster.
      value: infra-vclusters
      kind: optional

    - name: server
      description: Public server address to embed in the generated kubeconfig.
      value: ""
      kind: optional

  artifacts:
    - name: kubeconfig
      description: Kubeconfig for connecting to the vCluster.
      tags: [connect]

    - name: cluster-name
      description: Name of the created vCluster.

